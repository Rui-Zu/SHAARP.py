[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shaarp-py"
version = "1.0.0"
description = "Second-harmonic generation in anisotropic crystals and multilayers: the SHAARP.si and SHAARP.ml methods as one free Python package and desktop app"
readme = "README.md"
authors = [
  {name = "Rui Zu"},
  {name = "Bo Wang"},
  {name = "Lincoln Weber"},
  {name = "Akash Saha"},
  {name = "Long-Qing Chen"},
  {name = "Venkatraman Gopalan"},
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "matplotlib>=3.7",
  "scipy>=1.9",
  # Required, not optional: shaarp/__init__.py imports the symbolic solvers eagerly, so a bare
  # `import shaarp` needs sympy. Declaring it only as the `symbolic` extra made every install
  # without that extra unimportable.
  "sympy>=1.12"
]

[project.optional-dependencies]
# Kept as an empty alias so install commands that already carry [symbolic] keep resolving.
symbolic = []
interactive = ["ipywidgets>=8", "ipython>=8"]
desktop = ["PySide6>=6.5"]
dev = ["pytest>=7"]
# Independent codes used ONLY to regenerate benchmarks/isotropic_stack_reference_v1.json. The
# committed fixture is what the suite reads, so neither package is needed to run the tests, build
# the app, or use SHAARP.py. Both are pure Python: tmm declares no dependencies, inkstone needs
# only numpy and scipy. inkstone is AGPL-3.0 -- it is a development tool that produces numbers and
# is never shipped, linked into, or served by this package.
benchmark = ["tmm>=0.2", "inkstone>=0.3"]

[project.scripts]
shaarp = "shaarp.cli:main"

[project.gui-scripts]
shaarp-gui = "shaarp.desktop_app:main"

[tool.setuptools.packages.find]
include = ["shaarp*"]

[tool.setuptools.package-data]
# ship the Mathematica-exported case-study dispersion data, the published refractive-index tables
# for the dispersive material variants, and the #SHAARP logos/icon with the wheel.
# NOTE the "*.json" glob is TOP-LEVEL ONLY -- dispersion_data/ needs its own entries or the
# dispersive materials vanish from an installed wheel while working fine from a source checkout.
shaarp = ["*.json", "assets/*.png", "assets/*.ico",
          "dispersion_data/*.csv", "dispersion_data/*.json"]
