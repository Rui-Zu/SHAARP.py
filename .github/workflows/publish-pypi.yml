# Publish SHAARP.py to PyPI, so that installing it is just:
#
#     pip install shaarp-py
#
# ...instead of the git+https line the README carries while the package is unpublished.
#
# This is a SEPARATE, manually-triggered workflow on purpose. Publishing needs one-time setup on
# pypi.org (below), and if that setup is missing the run fails — which must never take a Release
# build down with it. Cutting a release and publishing to PyPI stay independent.
#
# ONE-TIME SETUP (a few minutes, on pypi.org, done once):
#   1. Create an account at https://pypi.org/account/register/ and verify the email.
#   2. Go to https://pypi.org/manage/account/publishing/ and add a "pending publisher":
#        PyPI Project Name : shaarp-py
#        Owner             : Rui-Zu
#        Repository name   : SHAARP.py
#        Workflow name     : publish-pypi.yml
#        Environment name  : pypi
#   3. In this repo: Settings -> Environments -> New environment -> name it exactly  pypi
# No API token is ever created or stored: the runner proves its identity to PyPI with a short-lived
# OIDC token (Trusted Publishing). That is why `id-token: write` is the only permission needed.
#
# TO PUBLISH: Actions -> "Publish to PyPI" -> Run workflow -> type the tag (e.g. v1.0.0).
# A version can be uploaded to PyPI exactly ONCE and can never be replaced — only yanked. Publish
# from a tag you have already released and tested.
name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v1.0.0 (must already exist)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing; no secrets stored in this repo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        run: |
          set -euo pipefail
          PYPROJECT_VERSION=$(grep -m1 '^version *= *"' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          WANT="${{ inputs.tag }}"
          if [ "${WANT#v}" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag ${WANT} does not match pyproject.toml version ${PYPROJECT_VERSION}."
            exit 1
          fi
          echo "publishing shaarp-py ${PYPROJECT_VERSION}"

      - name: Build the wheel + sdist, and validate their metadata
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
